<!DOCTYPE html>

<head>
<meta charset="UTF-8" />
<title>SVG Loading Spinner</title>
<style>
  body{
    margin:0;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f7f7f7;
  }

  .loader svg{
    width:80px;
    height:80px;
    display:block;
  }

  /* 전체 회전 */
  .rot{
    transform-origin: 50% 50%;
    animation: spin 1.2s linear infinite;
  }

  /* 꽃잎 점멸 */
  .petal{
    opacity: .25;
    animation: pulse 1s ease-in-out infinite;
  }

  .p1{ animation-delay: 0s; }
  .p2{ animation-delay: .12s; }
  .p3{ animation-delay: .24s; }
  .p4{ animation-delay: .36s; }
  .p5{ animation-delay: .48s; }

  @keyframes spin{
    to{ transform: rotate(360deg); }
  }

  @keyframes pulse{
    0%,100%{ opacity:.25; }
    50%{ opacity:1; }
  }
</style>
</head>
